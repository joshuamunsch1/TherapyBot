# Render Blueprint - https://render.com/docs/blueprint-spec
# In the Render dashboard: New -> Blueprint -> pick this repository.
#
# This runs on Render's Free compute plan, which has no persistent disk and
# wipes its filesystem every time the service restarts or spins down. Nothing
# is stored locally: transcripts go to an external Postgres database that you
# create separately and pass in as DATABASE_URL. See the README.
services:
  - type: web
    name: psychopathology_training_bot
    runtime: python
    region: frankfurt          # EU hosting; put the database in the same region
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker keeps memory and database connections low on the 512 MB free
    # instance. Threads, not workers, give the concurrency: each request spends
    # most of its time waiting on the model.
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: THERAPYBOT_SECRET
        generateValue: true    # Render generates a random value once and keeps it
      - key: THERAPYBOT_MODEL
        value: claude-sonnet-5
      - key: THERAPYBOT_MAX_MESSAGES
        value: "40"
      # The four below are secrets: Render prompts you for them when you create
      # the Blueprint, and they never go into the repository.
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: THERAPYBOT_ADMIN_PASSWORD
        sync: false
      - key: THERAPYBOT_ACCESS_CODE
        sync: false
